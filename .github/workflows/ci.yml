# Builds the compiler and runs the whole suite -- parse, roundtrip, typecheck,
# error tests, Goose/native C at -O0 and -O2, targeted GS_DEBUG=1 tests, a
# second C-front-end probe, the in-process TinyCC backend, and samples -- on
# all three desktop platforms.
# One additional Linux profile instruments the compiler and generated C;
# sanitizer x platform x optimization x runtime mode is deliberately not a matrix.
# The runners bring the compilers
# the test script looks for: MSVC and its bundled clang on Windows, gcc and
# clang on Ubuntu, Apple clang on macOS.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running job's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / baseline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing is a result about that platform, not a reason to
      # stop finding out about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The TinyCC submodule is what the JIT backend is built from, and SDL
      # what the gfx module is; without either the compiler still builds, and
      # that part of the suite is skipped.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # SDL3, built for the gfx module from its submodule, needs the headers
      # of what it can talk to (third_party/SDL/docs/README-linux.md, less
      # OpenGL, which it is built without); with no window system at all the
      # build takes the no-gfx path instead. Mesa's lavapipe is a Vulkan
      # device with no GPU, for the gfx tests to run on.
      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libdbus-1-dev
          libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev
          libdecor-0-dev liburing-dev mesa-vulkan-drivers libvulkan1

      # CMAKE_BUILD_TYPE is what the single-config generators read and --config
      # is what the Visual Studio generator reads; passing both builds Debug
      # (asserts on) everywhere.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: python test/run_tests.py --profile baseline --cc native --require-clang

  sanitize:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No submodule checkout: the sanitizer profile does not run the JIT,
      # whose program is uninstrumented and outlives its own allocations.
      # Without SDL this is also the build that takes the no-gfx path, where
      # the gfx tests still typecheck and generate C.

      # Instrument the C++ compiler as well as the C it emits. -O1 keeps
      # useful sanitizer stacks and compiler build time modest. Generated C
      # disables only alignment checks because Goose deliberately packs data;
      # the compiler itself retains the full undefined-behavior checks.
      - name: Configure instrumented compiler
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build instrumented compiler
        run: cmake --build build-sanitize --parallel 2

      - name: Test compiler, generated C, runtime lifecycle and samples
        run: python test/run_tests.py --exe build-sanitize/goose --profile sanitize --cc clang
